[project]
name = "turnstyl"
version = "0.1.0"
description = "A metered AI agent that gets paid per step in USDC on Base and remembers everything in Sibyl Memory."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Minos" }]
readme = "README.md"
dependencies = [
    "sibyl-memory-client",
    "web3",
    "anthropic",
    "python-dotenv",
    "rich",
    "typer",
    "pydantic",
    "fastapi",
    "uvicorn",
]

[project.scripts]
turnstyl = "turnstyl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstyl"]
